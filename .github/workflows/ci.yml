name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Resolve remote package + build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve ProactiveAgentKit from GitHub (pinned upToNextMajor 1.0.0)
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo
      - name: Build Demo (generic iOS Simulator; warnings are errors on the Demo target)
        run: |
          set -o pipefail
          xcodebuild build -project Demo.xcodeproj -scheme Demo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 40
